---
lancedb_block_devices: []
lancedb_volume_group: lancedb_hot
lancedb_logical_volume: data
lancedb_mount_path: /mnt/lancedb-hot
lancedb_lvm_stripe_size_kb: 256

lancedb_service_git_url: ""
lancedb_service_git_version: main
lancedb_install_path: /opt/oci-lancedb-hybrid
lancedb_service_user: ubuntu
lancedb_service_group: ubuntu
lancedb_virtualenv_path: "{{ lancedb_install_path }}/.venv"
lancedb_update_package_cache: true

lancedb_database_path: "{{ lancedb_mount_path }}/lancedb-hot"
lancedb_table_name: ""
lancedb_vector_dimensions: 768
lancedb_bind_host: 0.0.0.0
lancedb_service_port: 8080
# Required: CIDRs permitted through the Ubuntu host firewall to the search API.
# Terraform places the selected private LB in its search subnet and writes that
# subnet CIDR into the generated Ansible inventory.
lancedb_host_firewall_source_cidrs: []
lancedb_oci_bucket: ""
lancedb_oci_auth: instance_principal
lancedb_initial_ingest_command: ""

# Object Storage event ingestion. Terraform writes the Queue values into its
# generated inventory; source routes remain a deliberate data-plane decision.
lancedb_ingestion_enabled: false
lancedb_ingestion_worker_port: 8090
lancedb_ingestion_worker_source_cidrs: []
lancedb_ingestion_queue_id: ""
lancedb_ingestion_queue_endpoint: ""
lancedb_source_routes: []
# Full bucket/table comparison protects against events missed while a component
# is unavailable.  OCI Events remains the lower-latency update path.
lancedb_reconciliation_enabled: true
lancedb_reconciliation_interval: 1h
