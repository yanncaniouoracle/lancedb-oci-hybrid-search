---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart LanceDB search service
  ansible.builtin.systemd_service:
    name: lancedb-search.service
    state: restarted

- name: Restart LanceDB gRPC search service
  ansible.builtin.systemd_service:
    name: lancedb-grpc-search.service
    state: restarted
