---
- name: Validate required search-service configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - lancedb_block_devices | length > 0
      - lancedb_service_git_url | length > 0
      - lancedb_table_name | length > 0
      - lancedb_host_firewall_source_cidrs | length > 0
      - lancedb_oci_bucket | length > 0
      - not lancedb_ingestion_enabled | bool or lancedb_ingestion_queue_id | length > 0
      - not lancedb_ingestion_enabled | bool or lancedb_ingestion_queue_endpoint | length > 0
      - not lancedb_ingestion_enabled | bool or lancedb_source_routes | length > 0
    fail_msg: >-
      This role requires Ubuntu/Debian, explicit attached-device paths, a Git
      URL, a table name, firewall source CIDR, and the raw-payload bucket. Do
      not infer device paths or expose the search API to an unbounded CIDR.

- name: Install operating-system dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - iptables
      - lvm2
      - python3-pip
      - python3-venv
      - xfsprogs
    state: present
    update_cache: "{{ lancedb_update_package_cache | bool }}"

- name: Install the persistent search API firewall helper
  ansible.builtin.template:
    src: lancedb-firewall.sh.j2
    dest: /usr/local/sbin/lancedb-search-firewall
    owner: root
    group: root
    mode: '0750'

- name: Install the persistent search API firewall service
  ansible.builtin.template:
    src: lancedb-search-firewall.service.j2
    dest: /etc/systemd/system/lancedb-search-firewall.service
    owner: root
    group: root
    mode: '0644'

- name: Enable the search API firewall before serving traffic
  ansible.builtin.systemd_service:
    name: lancedb-search-firewall.service
    enabled: true
    state: started
    daemon_reload: true

- name: Install the persistent ingestion worker firewall helper
  ansible.builtin.template:
    src: lancedb-ingestion-firewall.sh.j2
    dest: /usr/local/sbin/lancedb-ingestion-firewall
    owner: root
    group: root
    mode: '0750'
  when: lancedb_ingestion_enabled | bool

- name: Install the persistent ingestion worker firewall service
  ansible.builtin.template:
    src: lancedb-ingestion-firewall.service.j2
    dest: /etc/systemd/system/lancedb-ingestion-firewall.service
    owner: root
    group: root
    mode: '0644'
  when: lancedb_ingestion_enabled | bool

- name: Enable the worker firewall before worker traffic
  ansible.builtin.systemd_service:
    name: lancedb-ingestion-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  when: lancedb_ingestion_enabled | bool

- name: Verify declared Block Volume devices are present
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ lancedb_block_devices }}"
  register: lancedb_block_device_status

- name: Refuse to create storage on a missing device
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.isblk
    fail_msg: >-
      Declared hot-tier device {{ item.item }} is missing or is not a block
      device.
  loop: "{{ lancedb_block_device_status.results }}"

- name: Check whether each device is already an LVM physical volume
  ansible.builtin.command:
    cmd: "pvs --noheadings {{ item }}"
  loop: "{{ lancedb_block_devices }}"
  register: lancedb_pv_status
  changed_when: false
  failed_when: false

- name: Check for an existing non-LVM filesystem on declared devices
  ansible.builtin.command:
    cmd: "lsblk --noheadings --output FSTYPE {{ item }}"
  loop: "{{ lancedb_block_devices }}"
  register: lancedb_device_filesystem_status
  changed_when: false

- name: Refuse to overwrite a non-LVM filesystem
  ansible.builtin.assert:
    that: >-
      item.stdout | trim == '' or
      lancedb_pv_status.results[ansible_loop.index0].rc == 0
    fail_msg: >-
      Declared hot-tier device {{ item.item }} already contains a filesystem.
      Choose a new empty Block Volume instead of overwriting data.
  loop: "{{ lancedb_device_filesystem_status.results }}"
  loop_control:
    extended: true

- name: Initialize declared devices as LVM physical volumes
  ansible.builtin.command:
    cmd: "pvcreate -y {{ item.item }}"
  loop: "{{ lancedb_pv_status.results }}"
  when: item.rc != 0

- name: Check whether the hot-tier volume group exists
  ansible.builtin.command:
    cmd: "vgs --noheadings {{ lancedb_volume_group }}"
  register: lancedb_vg_status
  changed_when: false
  failed_when: false

- name: Create the hot-tier volume group
  ansible.builtin.command:
    argv: "{{ ['vgcreate', lancedb_volume_group] + lancedb_block_devices }}"
  when: lancedb_vg_status.rc != 0

- name: Check whether the striped hot-tier logical volume exists
  ansible.builtin.command:
    cmd: >-
      lvs --noheadings
      /dev/{{ lancedb_volume_group }}/{{ lancedb_logical_volume }}
  register: lancedb_lv_status
  changed_when: false
  failed_when: false

- name: Create a striped hot-tier logical volume
  ansible.builtin.command:
    argv:
      - lvcreate
      - --stripes
      - "{{ lancedb_block_devices | length }}"
      - --stripesize
      - "{{ lancedb_lvm_stripe_size_kb }}"
      - --extents
      - 100%FREE
      - --name
      - "{{ lancedb_logical_volume }}"
      - "{{ lancedb_volume_group }}"
  when: lancedb_lv_status.rc != 0

- name: Check the hot-tier logical-volume filesystem
  ansible.builtin.command:
    cmd: >-
      blkid -s TYPE -o value
      /dev/{{ lancedb_volume_group }}/{{ lancedb_logical_volume }}
  register: lancedb_filesystem_status
  changed_when: false
  failed_when: false

- name: Refuse to replace a non-XFS logical-volume filesystem
  ansible.builtin.assert:
    that: >-
      lancedb_filesystem_status.stdout | trim == '' or
      lancedb_filesystem_status.stdout | trim == 'xfs'
    fail_msg: >-
      /dev/{{ lancedb_volume_group }}/{{ lancedb_logical_volume }} already has
      a non-XFS filesystem. Migration must be performed separately.

- name: Format the logical volume as XFS
  ansible.builtin.command:
    cmd: >-
      mkfs.xfs -f
      /dev/{{ lancedb_volume_group }}/{{ lancedb_logical_volume }}
  when: lancedb_filesystem_status.stdout | trim == ''

- name: Create the LanceDB mount path
  ansible.builtin.file:
    path: "{{ lancedb_mount_path }}"
    state: directory
    owner: "{{ lancedb_service_user }}"
    group: "{{ lancedb_service_group }}"
    mode: '0755'

- name: Persist the hot-tier XFS mount
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^/dev/{{ lancedb_volume_group }}/{{ lancedb_logical_volume }}\\s+"
    line: >-
      /dev/{{ lancedb_volume_group }}/{{ lancedb_logical_volume }}
      {{ lancedb_mount_path }} xfs defaults,noatime 0 2

- name: Check whether the hot tier is mounted
  ansible.builtin.command:
    # --target alone succeeds for the underlying root filesystem when the
    # directory exists, even if this logical volume is not mounted there.
    cmd: "findmnt --noheadings --mountpoint {{ lancedb_mount_path }}"
  register: lancedb_mount_status
  changed_when: false
  failed_when: false

- name: Mount the hot tier
  ansible.builtin.command:
    cmd: "mount {{ lancedb_mount_path }}"
  when: lancedb_mount_status.rc != 0

- name: Set hot-tier ownership after mounting
  ansible.builtin.file:
    path: "{{ lancedb_mount_path }}"
    state: directory
    owner: "{{ lancedb_service_user }}"
    group: "{{ lancedb_service_group }}"
    mode: '0755'

- name: Create the service installation directory
  ansible.builtin.file:
    path: "{{ lancedb_install_path }}"
    state: directory
    owner: "{{ lancedb_service_user }}"
    group: "{{ lancedb_service_group }}"
    mode: '0755'

- name: Fetch the versioned search-service source
  ansible.builtin.git:
    repo: "{{ lancedb_service_git_url }}"
    dest: "{{ lancedb_install_path }}"
    version: "{{ lancedb_service_git_version }}"
    force: false
  become_user: "{{ lancedb_service_user }}"
  notify: Restart LanceDB search service

- name: Install the search-service Python environment
  ansible.builtin.pip:
    name: ".[service,ingestion]"
    chdir: "{{ lancedb_install_path }}"
    virtualenv: "{{ lancedb_virtualenv_path }}"
    virtualenv_command: python3 -m venv
    extra_args: --upgrade
  become_user: "{{ lancedb_service_user }}"
  notify:
    - Restart LanceDB search service
    - Restart LanceDB gRPC search service

- name: Create the service configuration directory
  ansible.builtin.file:
    path: /etc/lancedb-search
    state: directory
    owner: root
    group: "{{ lancedb_service_group }}"
    mode: '0750'

- name: Render search-service environment
  ansible.builtin.template:
    src: lancedb.env.j2
    dest: /etc/lancedb-search/lancedb.env
    owner: root
    group: "{{ lancedb_service_group }}"
    mode: '0640'
  notify:
    - Restart LanceDB search service
    - Restart LanceDB gRPC search service

- name: Install the gRPC search service
  ansible.builtin.template:
    src: lancedb-grpc-search.service.j2
    dest: /etc/systemd/system/lancedb-grpc-search.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Enable and start the gRPC search service
  ansible.builtin.systemd_service:
    name: lancedb-grpc-search.service
    enabled: true
    state: started
    daemon_reload: true

- name: Render source-routing registry
  ansible.builtin.copy:
    content: "{{ lancedb_source_routes | to_json }}\n"
    dest: /etc/lancedb-search/source-routes.json
    owner: root
    group: "{{ lancedb_service_group }}"
    mode: '0640'
  when: lancedb_ingestion_enabled | bool

- name: Install the ingestion worker service
  ansible.builtin.template:
    src: lancedb-ingestion-worker.service.j2
    dest: /etc/systemd/system/lancedb-ingestion-worker.service
    owner: root
    group: root
    mode: '0644'
  when: lancedb_ingestion_enabled | bool

- name: Install the active ingestion controller on the first search node
  ansible.builtin.template:
    src: lancedb-ingestion-controller.service.j2
    dest: /etc/systemd/system/lancedb-ingestion-controller.service
    owner: root
    group: root
    mode: '0644'
  when:
    - lancedb_ingestion_enabled | bool
    - inventory_hostname == groups['lancedb_search'][0]

- name: Install the reconciliation service on the first search node
  ansible.builtin.template:
    src: lancedb-reconciliation.service.j2
    dest: /etc/systemd/system/lancedb-reconciliation.service
    owner: root
    group: root
    mode: '0644'
  when:
    - lancedb_ingestion_enabled | bool
    - lancedb_reconciliation_enabled | bool
    - inventory_hostname == groups['lancedb_search'][0]

- name: Install the reconciliation timer on the first search node
  ansible.builtin.template:
    src: lancedb-reconciliation.timer.j2
    dest: /etc/systemd/system/lancedb-reconciliation.timer
    owner: root
    group: root
    mode: '0644'
  when:
    - lancedb_ingestion_enabled | bool
    - lancedb_reconciliation_enabled | bool
    - inventory_hostname == groups['lancedb_search'][0]

- name: Install the systemd service
  ansible.builtin.template:
    src: lancedb-search.service.j2
    dest: /etc/systemd/system/lancedb-search.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart LanceDB search service

- name: Enable the search service
  ansible.builtin.systemd_service:
    name: lancedb-search.service
    enabled: true
    # A fresh table may be created by the explicit ingestion command below.
    # Do not attempt to start FastAPI before that table exists.
    state: "{{ 'stopped' if lancedb_initial_ingest_command | length > 0 else 'started' }}"
    daemon_reload: true

- name: Enable the local ingestion worker
  ansible.builtin.systemd_service:
    name: lancedb-ingestion-worker.service
    enabled: true
    state: started
    daemon_reload: true
  when: lancedb_ingestion_enabled | bool

- name: Enable the active ingestion controller
  ansible.builtin.systemd_service:
    name: lancedb-ingestion-controller.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - lancedb_ingestion_enabled | bool
    - inventory_hostname == groups['lancedb_search'][0]

- name: Enable the reconciliation timer
  ansible.builtin.systemd_service:
    name: lancedb-reconciliation.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - lancedb_ingestion_enabled | bool
    - lancedb_reconciliation_enabled | bool
    - inventory_hostname == groups['lancedb_search'][0]

- name: Run a workload-specific ingestion command when explicitly requested
  ansible.builtin.command:
    cmd: "{{ lancedb_initial_ingest_command }}"
    chdir: "{{ lancedb_install_path }}"
  become_user: "{{ lancedb_service_user }}"
  when: lancedb_initial_ingest_command | length > 0
  changed_when: true

- name: Start the search service after initial ingestion
  ansible.builtin.systemd_service:
    name: lancedb-search.service
    state: started
  when: lancedb_initial_ingest_command | length > 0
