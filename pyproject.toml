[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-lancedb-hybrid"
version = "0.1.1"
description = "OCI Object Storage plus Block Volume LanceDB search service"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.43",
  "numpy>=2.0",
  "oci>=2.187",
]

[project.optional-dependencies]
service = ["fastapi>=0.115", "grpcio>=1.84", "lancedb>=0.39", "protobuf>=5", "uvicorn[standard]>=0.30"]
ingestion = ["fastapi>=0.115", "lancedb>=0.39", "pyarrow>=18", "uvicorn[standard]>=0.30"]
mnist = ["lancedb>=0.39", "pillow>=10", "pyarrow>=18"]
sift = ["lancedb>=0.39", "pyarrow>=18"]

[project.scripts]
oci-lancedb-ingest-mnist = "oci_lancedb_hybrid.ingest_mnist:main"
oci-lancedb-ingest-sift1m = "oci_lancedb_hybrid.ingest_sift1m:main"
oci-lancedb-benchmark-sift1m = "oci_lancedb_hybrid.benchmark_sift1m:main"
oci-lancedb-benchmark-sift1m-grpc = "oci_lancedb_hybrid.benchmark_sift1m_grpc:main"
oci-lancedb-validate = "oci_lancedb_hybrid.validate:main"
oci-lancedb-search = "oci_lancedb_hybrid.service:run"
oci-lancedb-grpc-search = "oci_lancedb_hybrid.grpc_service:run"
oci-lancedb-ingestion-worker = "oci_lancedb_hybrid.ingestion_worker:run"
oci-lancedb-ingestion-controller = "oci_lancedb_hybrid.ingestion_controller:main"
oci-lancedb-reconcile = "oci_lancedb_hybrid.reconciliation:main"

[tool.setuptools.packages.find]
where = ["src"]
