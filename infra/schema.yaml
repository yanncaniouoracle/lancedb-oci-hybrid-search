---
title: LanceDB OCI Search Service
description: >-
  Private LanceDB search service with direct Block Volume hot tier and Object
  Storage source of truth
schemaVersion: 1.1.0
version: "1.0"
informationalText: >-
  Deploy independently from the GPU or Slurm cluster. The service uses an
  instance principal for Object Storage and exposes only a private query
  endpoint.

outputGroups:
  - title: Search service
    outputs:
      - search_service_endpoint
      - search_service_private_ips
      - object_storage_location
      - ingestion_pipeline
      - ansible_inventory

outputs:
  search_service_endpoint:
    title: Private search endpoint
    type: copyableString
    visible: true
  search_service_private_ips:
    title: Search-service private IPs
    type: copyableString
    visible: true
  object_storage_location:
    title: Object Storage payload location
    type: copyableString
    visible: true
  ingestion_pipeline:
    title: Object event ingestion resources
    type: copyableString
    visible: true
  ansible_inventory:
    title: Generated Ansible inventory
    type: copyableString
    visible: true

variableGroups:
  - title: General
    variables:
      - ${compartment_ocid}
      - ${region}
      - ${availability_domain}
      - ${deployment_name}
      - ${ssh_public_key}
  - title: Existing network
    variables:
      - ${network_compartment_ocid}
      - ${vcn_id}
      - ${subnet_ocid}
      - ${gpu_subnet_id}
      - ${enable_private_load_balancer}
      - ${load_balancer_min_bandwidth_mbps}
      - ${load_balancer_max_bandwidth_mbps}
  - title: Search-service compute
    variables:
      - ${search_image_ocid}
      - ${search_shape}
      - ${search_ocpus}
      - ${search_memory_gb}
      - ${search_service_count}
      - ${boot_volume_size_gb}
      - ${service_port}
  - title: Block Volume hot tier
    variables:
      - ${hot_tier_volume_count}
      - ${hot_tier_volume_size_gb}
      - ${hot_tier_vpus_per_gb}
  - title: Object Storage
    variables:
      - ${object_storage_bucket_name}
      - ${create_object_storage_bucket}
      - ${object_storage_prefix}
  - title: Instance principal access
    variables:
      - ${create_instance_principal_policy}
      - ${dynamic_group_name}
  - title: Object event ingestion
    variables:
      - ${enable_object_event_ingestion}
      - ${ingestion_worker_port}
      - ${ingestion_function_image}
      - ${ingestion_queue_retention_seconds}
      - ${ingestion_queue_visibility_seconds}

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Search-service compartment
    required: true
  region:
    type: string
    title: OCI region
    required: true
  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: Availability Domain
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: true
  deployment_name:
    type: string
    title: Deployment name
    pattern: "^[a-z][a-z0-9-]{0,30}$"
    default: lancedb-search
    required: true
  ssh_public_key:
    type: oci:core:ssh:publickey
    title: Public SSH key
    required: true
  network_compartment_ocid:
    type: oci:identity:compartment:id
    title: Network compartment
    default: ${compartment_ocid}
    required: true
  vcn_id:
    type: oci:core:vcn:id
    title: Existing VCN
    description: >-
      The picker displays VCN names and passes the selected VCN OCID to
      Terraform as vcn_id.
    dependsOn:
      compartmentId: ${network_compartment_ocid}
    required: true
  subnet_ocid:
    type: oci:core:subnet:id
    title: Existing private subnet
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${vcn_id}
      hidePublicSubnet: true
    required: true
  gpu_subnet_id:
    type: oci:core:subnet:id
    title: GPU or application private subnet
    description: >-
      Its CIDR block is automatically used for ingress to the search endpoint.
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${vcn_id}
      hidePublicSubnet: true
    required: true
  enable_private_load_balancer:
    type: boolean
    title: Create private load balancer
    default: false
  load_balancer_min_bandwidth_mbps:
    type: integer
    title: Load-balancer minimum bandwidth Mbps
    default: 10
    visible: ${enable_private_load_balancer}
  load_balancer_max_bandwidth_mbps:
    type: integer
    title: Load-balancer maximum bandwidth Mbps
    default: 100
    visible: ${enable_private_load_balancer}
  search_image_ocid:
    type: oci:core:image:id
    title: Search-service image
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: true
  search_shape:
    type: oci:core:instanceshape:name
    title: Search-service shape
    dependsOn:
      compartmentId: ${compartment_ocid}
    default: VM.Standard.E5.Flex
    required: true
  search_ocpus:
    type: integer
    title: OCPUs per service node
    minimum: 1
    default: 8
    required: true
  search_memory_gb:
    type: integer
    title: Memory GB per service node
    minimum: 1
    default: 64
    required: true
  search_service_count:
    type: integer
    title: Search-service nodes
    description: >-
      Each node owns a local hot tier. Scale read capacity with explicit shards
      or replicas.
    minimum: 1
    default: 1
    required: true
  boot_volume_size_gb:
    type: integer
    title: Boot volume size GB
    minimum: 50
    default: 100
    required: true
  service_port:
    type: integer
    title: Private search-service port
    minimum: 1
    maximum: 65535
    default: 8080
    required: true
  hot_tier_volume_count:
    type: integer
    title: Balanced volumes per service node
    description: >-
      Directly attached, non-shareable volumes configured by Ansible as an LVM
      stripe set.
    minimum: 1
    default: 1
    required: true
  hot_tier_volume_size_gb:
    type: integer
    title: Volume brick size GB
    description: >-
      500 GB reaches the Balanced 25,000 IOPS per-volume cap and is a practical
      standard brick size.
    minimum: 50
    default: 500
    required: true
  hot_tier_vpus_per_gb:
    type: integer
    title: Block Volume VPUs per GB
    description: Use 10 for Balanced performance.
    default: 10
    required: true
  object_storage_bucket_name:
    type: string
    title: Raw-payload bucket
    required: true
  create_object_storage_bucket:
    type: boolean
    title: Create the raw-payload bucket
    description: >-
      Set false only when the bucket existed before the first stack apply and
      remains outside Terraform state. Do not switch an existing managed stack
      from true to false.
    default: false
  object_storage_prefix:
    type: string
    title: Raw-payload prefix
    default: ""
  create_instance_principal_policy:
    type: boolean
    title: Create read-only Object Storage policy
    description: >-
      Requires an existing, narrowly scoped dynamic group containing the service
      instances.
    default: false
  create_function_queue_policy:
    type: boolean
    title: Create Function Queue policy
    description: >-
      Enable only when the current user is authorized to create IAM policies.
      Leave disabled when the tenancy provides the Function resource-principal
      queue-push policy centrally.
    default: false
  dynamic_group_name:
    type: string
    title: Existing dynamic-group name
    visible: ${create_instance_principal_policy}
    required: true
  enable_object_event_ingestion:
    type: boolean
    title: Enable Object Storage event ingestion
    description: >-
      Creates a compartment-wide, regional Object Storage create update delete
      rule, a Function-to-Queue bridge, and Queue configuration for Ansible.
      Existing buckets must independently enable Emit object events.
    default: false
  ingestion_worker_port:
    type: integer
    title: Private worker port
    default: 8090
    minimum: 1
    maximum: 65535
    visible: ${enable_object_event_ingestion}
  ingestion_function_image:
    type: string
    title: Event router OCIR image
    description: >-
      Reference the shared OCIR repository's versioned router image. Publish it
      once outside ORM; provide an immutable digest when possible.
    visible: ${enable_object_event_ingestion}
    required: true
  ingestion_source_routes_json:
    type: string
    title: Source-routing registry (JSON)
    description: >-
      JSON array of bucket/prefix/table routes applied by every ingestion
      worker. Example: [{"bucket":"lancedb-cold","prefix":"images/","table":"image_vectors"}].
      Longest matching prefix wins.
    visible: ${enable_object_event_ingestion}
    required: true
  ingestion_queue_retention_seconds:
    type: integer
    title: Queue retention seconds
    default: 345600
    visible: ${enable_object_event_ingestion}
  ingestion_queue_visibility_seconds:
    type: integer
    title: Queue visibility seconds
    default: 120
    visible: ${enable_object_event_ingestion}
